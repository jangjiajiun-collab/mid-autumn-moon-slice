<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#060818" />
    <meta name="description" content="一刀斬開月餅的互動式中秋電子賀卡。" />
    <title>月光一閃・中秋賀卡</title>
    <link rel="preload" as="image" href="/young-swordsman.jpg" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23f8d98a'/%3E%3Cpath d='M12 34c15-6 26-8 40-18' stroke='%2308132a' stroke-width='5'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main id="card" aria-label="中秋互動賀卡">
      <canvas id="webgl" aria-hidden="true"></canvas>
      <div class="grain" aria-hidden="true"></div>
      <div class="lantern left" aria-hidden="true"><i></i><b></b></div>
      <div class="lantern right" aria-hidden="true"><i></i><b></b></div>
      <div class="moon" aria-hidden="true"><span class="crack"></span></div>
      <div class="mist" aria-hidden="true"></div>
      <img class="swordsman" src="/young-swordsman.jpg" alt="揮刀的小劍士" />
      <div class="stage" aria-live="polite">
        <p class="eyebrow">月光一閃</p>
        <h1 id="prompt">滑動斬月餅</h1>
        <p class="hint" id="hint">向任意方向揮出一刀</p>
      </div>
      <div class="mooncake" id="mooncake" aria-hidden="true"><span class="yolk"></span><i></i></div>
      <div id="slash" class="slash" aria-hidden="true"></div>
      <div id="flash" class="flash" aria-hidden="true"></div>
      <section class="ending" id="ending" aria-hidden="true">
        <p>月光落下，心意正圓</p>
        <h2>中秋節快樂</h2>
        <strong>月圓人團圓</strong>
        <button id="again" type="button">再斬一次 <span>↻</span></button>
      </section>
      <button id="start" class="start" type="button">開啟月光</button>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
